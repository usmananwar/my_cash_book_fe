<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Cash Book</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <meta name="theme-color" content="#4CAF50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="cashbook-body">
    <div class="app-container">
        <!-- Header -->
        <header class="cashbook-header">
            <div class="header-content">
                <div class="user-greeting">
                    <h2>My Profile</h2>
                    <p>Manage your account settings</p>
                </div>
                <div class="header-actions">
                    <button class="header-btn" id="backBtn" title="Back to Dashboard">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <button class="header-btn" id="logoutBtn" title="Logout">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Profile Content -->
        <main class="cashbook-content">
            <!-- Profile Form -->
            <div class="form-container">
                <form id="profileForm">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required readonly>
                        <small class="form-note">Email cannot be changed</small>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Optional">
                    </div>

                    <div class="form-group">
                        <label for="dateOfBirth">Date of Birth</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="updateBtn">
                            <span class="btn-text">Update Profile</span>
                            <span class="btn-loading">Updating...</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Change Password Section -->
            <div class="form-container">
                <h2>Change Password</h2>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="currentPassword">Current Password</label>
                        <input type="password" id="currentPassword" name="currentPassword" required>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-secondary" id="changePasswordBtn">
                            <span class="btn-text">Change Password</span>
                            <span class="btn-loading">Changing...</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="../js/profile.js"></script>
</body>
</html>
